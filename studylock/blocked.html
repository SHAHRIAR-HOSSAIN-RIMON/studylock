<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blocked: stay focused · StudyLock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-phase="focus">
  <main class="blocked">
    <div>
      <img src="icons/icon128.png" alt="">
      <h1 id="title">This site is blocked while you focus</h1>
      <p id="subtitle" class="muted">Your focus session is still running.</p>
      <div id="time" class="big">--:--</div>
      <blockquote id="quote"></blockquote>
      <div class="controls">
        <button id="back" type="button">Go back</button>
      </div>
    </div>
  </main>
  <script src="shared.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
